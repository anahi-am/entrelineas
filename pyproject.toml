[project]
name = "entrelineas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
